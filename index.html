<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Leyi Wang (王乐怡) — MSc Signal Processing & Machine Learning, NTU Singapore. Personal site.">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style><title>Leyi Wang 王乐怡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#1B2336; --muted:#5A6378; --line:#DCE1EB;
  --denim:#3C6399; --denim-soft:#DDE7F4; --red:#D8382E; --red-soft:#FBE3E0;
  --honey:#B97A22; --honey-soft:#F4E6CC; --grid:rgba(60,99,153,.10);
  --shadow:0 18px 40px -18px rgba(27,35,54,.35);
  --f-display:"Bricolage Grotesque","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Figtree","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-han:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1321; --surface:#161D2F; --ink:#E7EBF4; --muted:#9BA4B9; --line:#2A3349;
    --denim:#86A9DB; --denim-soft:#1F2D48; --red:#FF6B5E; --red-soft:#3A1F22;
    --honey:#E3AA55; --honey-soft:#3A2E1B; --grid:rgba(134,169,219,.10);
    --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1321; --surface:#161D2F; --ink:#E7EBF4; --muted:#9BA4B9; --line:#2A3349;
  --denim:#86A9DB; --denim-soft:#1F2D48; --red:#FF6B5E; --red-soft:#3A1F22;
  --honey:#E3AA55; --honey-soft:#3A2E1B; --grid:rgba(134,169,219,.10);
  --shadow:0 18px 40px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;}
.wrap{max-width:1160px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.mark{font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.mark i{width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block;animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 50%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
.nav{display:flex;gap:18px;margin-left:auto;font-size:.9rem}
.nav a{color:var(--muted);text-decoration:none}
.nav a:hover{color:var(--ink)}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;font-size:.8rem;font-weight:600}
.lang button{background:none;border:0;padding:5px 12px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:720px){.nav{display:none}.lang{margin-left:auto}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,540px);gap:clamp(24px,4vw,56px);align-items:center;padding-block:clamp(28px,5vw,64px) 24px}
.eyebrow{display:inline-flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:.82rem;color:var(--muted)}
.eyebrow b{color:var(--denim);font-weight:600}
h1{margin:18px 0 6px;line-height:.95;text-wrap:balance}
.name-main{display:block;font-family:var(--f-display);font-weight:800;font-size:clamp(3rem,8vw,5.6rem);letter-spacing:-.045em}
.name-sub{display:block;font-family:var(--f-han);font-weight:700;font-size:clamp(1.3rem,3vw,1.9rem);color:var(--denim);margin-top:10px;letter-spacing:.08em}
html[lang="zh"] .name-main{font-family:var(--f-han);font-weight:900;letter-spacing:.04em}
html[lang="zh"] .name-sub{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em}
.tagline{font-size:clamp(1.05rem,1.6vw,1.2rem);max-width:34em;color:var(--ink);margin:20px 0 0}
.tagline em{font-style:normal;background:linear-gradient(transparent 62%,var(--honey-soft) 62%)}
.seek{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.seek .brk{flex-basis:100%;height:0}
.chip{font-size:.8rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip.hot{border-color:var(--red);color:var(--red);background:var(--red-soft)}

/* oscilloscope */
.scope{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px 12px}
.scope-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.scope canvas{display:block;width:100%;height:78px;cursor:crosshair;touch-action:pan-y}
.scope-hint{font-size:.78rem;color:var(--muted)}

/* avatar stage */
.stage{position:relative;width:100%;max-width:540px;aspect-ratio:1;margin-inline:auto;container-type:inline-size}
.avatar-btn{position:absolute;left:50%;top:50%;width:54%;transform:translate(-50%,-50%);background:none;border:0;padding:0;border-radius:50%;transition:transform .5s cubic-bezier(.3,1.6,.5,1);z-index:3}
.avatar-btn svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 16px 20px rgba(27,35,54,.22))}
.stage.open .avatar-btn{transform:translate(-50%,-52%) scale(1.04)}
.ring{position:absolute;left:50%;top:52%;width:58%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--denim) 55%,transparent);animation:spin 40s linear infinite;z-index:1}
.stage.open .ring{width:88%;border-color:color-mix(in srgb,var(--red) 45%,transparent);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.hint{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);white-space:nowrap;font-size:.82rem;color:var(--muted);display:flex;gap:6px;align-items:center;transition:opacity .3s}
.hint::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.6s infinite}
.stage.open .hint{opacity:0}
.orbit{list-style:none;margin:0;padding:0}
.bubble{position:absolute;left:50%;top:50%;z-index:4;width:max-content;max-width:11rem;
  transform:translate(-50%,-50%) scale(.2);opacity:0;pointer-events:none;
  transition:transform .55s cubic-bezier(.3,1.5,.5,1),opacity .25s;transition-delay:calc(var(--i)*40ms)}
.stage.open .bubble{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(1);opacity:1;pointer-events:auto;transition-delay:calc(var(--i)*60ms)}
.bubble button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--ink);border-radius:16px;padding:8px 12px 8px 8px;box-shadow:4px 4px 0 var(--ink);transition:transform .15s,box-shadow .15s,background .15s}
.bubble button:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--red)}
.bubble .ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--denim-soft);color:var(--denim)}
.bubble:nth-child(even) .ic{background:var(--honey-soft);color:var(--honey)}
.bubble .t{display:block;font-weight:600;font-size:.92rem;line-height:1.2}
.bubble .s{display:block;font-size:.74rem;color:var(--muted);line-height:1.25}
.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* avatar life: float, blink, happy face, sparkles */
#toon{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
#eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
#eyes,#mouthSmall{transition:opacity .2s}
#eyesHappy,#mouthBig{opacity:0;transition:opacity .2s}
.stage.open #eyes,.stage.open #mouthSmall{opacity:0}
.stage.open #eyesHappy,.stage.open #mouthBig{opacity:1}
#blush{transition:opacity .4s}
.stage.open #blush{opacity:1}
#glasses{transform-box:fill-box;transform-origin:50% 100%;transition:transform .5s cubic-bezier(.4,1.8,.5,1)}
.stage.open #glasses{transform:translateY(-6px) rotate(-8deg)}
#ahoge{transform-box:fill-box;transform-origin:0% 100%;animation:sway 2.4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(14deg)}}
.spark{transform-box:fill-box;transform-origin:center;transform:scale(0);opacity:0;transition:transform .45s cubic-bezier(.3,1.8,.5,1),opacity .2s}
.stage.open .spark{transform:scale(1);opacity:1;animation:twinkle 1.6s ease-in-out infinite}
.stage.open .spark:nth-of-type(2){transition-delay:.08s;animation-delay:.3s}
.stage.open .spark:nth-of-type(3){transition-delay:.16s;animation-delay:.6s}
.stage.open .spark:nth-of-type(4){transition-delay:.24s;animation-delay:.9s}
@keyframes twinkle{50%{transform:scale(.75) rotate(12deg)}}

@media (max-width:900px){.hero{grid-template-columns:1fr}.stage{order:-1}}
@media (max-width:560px){
  .stage{aspect-ratio:auto;container-type:normal;display:flex;flex-direction:column;align-items:center;gap:18px}
  .avatar-btn,.stage.open .avatar-btn{position:relative;left:auto;top:auto;transform:none;width:66%}
  .ring{top:33%;width:74%}.stage.open .ring{width:74%}
  .hint{display:none}
  .orbit{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
  .bubble,.stage.open .bubble{position:static;transform:none;opacity:1;pointer-events:auto;max-width:none;width:auto;animation:pop .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i)*70ms)}
  .bubble button{width:100%}
}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* readouts */
.readouts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin-block:8px 0}
.ro{padding:16px 18px;border-left:1px solid var(--line)}
.ro:first-child{border-left:0}
.ro .v{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.ro .v small{font-size:.5em;color:var(--muted);font-weight:600;margin-left:3px}
.ro .l{font-size:.82rem;color:var(--muted);line-height:1.35;margin-top:4px}
@media (max-width:820px){.readouts{grid-template-columns:repeat(2,minmax(0,1fr))}.ro{border-left:0;border-top:1px solid var(--line)}.ro:nth-child(-n+2){border-top:0}.ro:nth-child(even){border-left:1px solid var(--line)}.ro:last-child{grid-column:1/-1}}

/* sections */
section.block{padding-block:clamp(48px,7vw,84px) 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
h2{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.035em;line-height:1.05;margin:6px 0 0;text-wrap:balance}
html[lang="zh"] h2{letter-spacing:0}
.sec-head p{margin:0;max-width:30em;color:var(--muted)}

/* channel list */
.channels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ch{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;transition:border-color .2s,transform .2s}
.ch:hover{border-color:var(--ink);transform:translateY(-3px)}
.ch-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ch h3{margin:0;font-size:1.12rem;font-weight:600}
.ch p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.5}
.ch .more{margin-top:auto;padding-top:6px;font-size:.85rem;font-weight:600;color:var(--red)}
.ch .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--denim-soft);color:var(--denim)}
@media (max-width:860px){.channels{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.channels{grid-template-columns:1fr}}

/* timeline */
.tl-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 10px}
.tl{min-width:760px;display:grid;grid-template-columns:92px 1fr;row-gap:0}
.tl-lane-name{font-size:.82rem;font-weight:600;color:var(--muted);display:flex;align-items:center;border-top:1px dashed var(--line)}
.tl-track{position:relative;height:64px;border-top:1px dashed var(--line)}
.tl-lane-name:first-of-type,.tl-track:nth-of-type(2){border-top:0}
.tl-bar{position:absolute;top:18px;height:28px;border-radius:8px;border:1.5px solid var(--ink);background:var(--denim-soft);font-size:.76rem;font-weight:600;padding:0 8px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .15s,box-shadow .15s}
.tl-bar.c-intern,.tl-bar.c-stage{background:var(--red-soft)}
.tl-bar.c-lead,.tl-bar.c-projects{background:var(--honey-soft)}
.tl-bar:hover,.tl-bar:focus-visible{transform:translateY(-2px);box-shadow:3px 3px 0 var(--ink)}
.tl-pt{position:absolute;top:24px;width:16px;height:16px;margin-left:-8px;transform:rotate(45deg);background:var(--red);border:1.5px solid var(--ink);padding:0;transition:transform .15s}
.tl-pt:hover,.tl-pt:focus-visible{transform:rotate(45deg) scale(1.3)}
.tl-pt span{position:absolute;left:50%;transform:rotate(-45deg);white-space:nowrap;font-size:.72rem;font-weight:600;color:var(--ink);pointer-events:none}
.tl-pt.up span{bottom:16px;left:14px}
.tl-pt.down span{top:16px;left:-6px}
.tl-axis{position:relative;height:28px;border-top:1.5px solid var(--ink);grid-column:2}
.tl-axis span{position:absolute;top:6px;transform:translateX(-50%);font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.tl-axis span::before{content:"";position:absolute;left:50%;top:-10px;height:6px;border-left:1.5px solid var(--ink)}
.tl-now{position:absolute;top:0;bottom:0;border-left:2px solid var(--red);pointer-events:none}
.tl-now::after{content:attr(data-label);position:absolute;top:-2px;left:6px;font-family:var(--f-mono);font-size:.66rem;color:var(--red);white-space:nowrap}

/* piano */
.piano-wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:stretch}
.piano{position:relative;display:flex;height:250px;background:var(--ink);padding:14px 14px 0;border-radius:16px 16px 10px 10px;box-shadow:var(--shadow);user-select:none}
.wkey{flex:1;position:relative;margin:0 2px;border:0;border-radius:0 0 8px 8px;background:#FBFBF8;color:#1B2336;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 2px 12px;gap:4px;transition:transform .08s,background .15s;box-shadow:inset 0 -6px 0 #D9DCE3}
.wkey:hover{background:#FFF7E6}
.wkey.on{transform:translateY(3px);box-shadow:inset 0 -2px 0 #D9DCE3;background:#FFE9C7}
.wkey.sel{background:#FFE9C7}
.wkey.sel::after{content:"";position:absolute;top:44%;width:10px;height:10px;border-radius:50%;background:#D8382E}
.wkey .n{font-family:var(--f-mono);font-size:.78rem;font-weight:600}
.wkey .k{font-family:var(--f-mono);font-size:.62rem;color:#8A91A3;border:1px solid #CDD2DC;border-radius:4px;padding:0 4px}
.bkey{position:absolute;top:14px;width:9%;height:56%;margin-left:-4.5%;border:0;border-radius:0 0 6px 6px;background:#10141F;box-shadow:inset 0 -5px 0 #2B3347;z-index:2;transition:transform .08s}
.bkey.on{transform:translateY(2px);box-shadow:inset 0 -2px 0 #2B3347}
.strength{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px}
.strength .note{font-family:var(--f-mono);font-size:.78rem;color:var(--red);letter-spacing:.08em}
.strength h3{margin:0;font-family:var(--f-display);font-size:1.6rem;letter-spacing:-.02em;line-height:1.15}
html[lang="zh"] .strength h3{letter-spacing:0}
.strength p{margin:0;color:var(--muted)}
.strength .row{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.88rem;font-weight:600;transition:box-shadow .15s,transform .15s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.btn.solid{background:var(--ink);color:var(--bg)}
.strength.flash h3{animation:flash .4s}
@keyframes flash{from{transform:translateY(6px);opacity:.3}}
@media (max-width:820px){.piano-wrap{grid-template-columns:1fr}.piano{height:210px}}
@media (max-width:420px){.wkey .k{display:none}}

/* contact */
.contact{margin-block:clamp(48px,7vw,84px) 40px;background:var(--ink);color:var(--bg);border-radius:20px;padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center}
.contact h2{color:var(--bg)}
.contact p{color:color-mix(in srgb,var(--bg) 70%,transparent);margin:10px 0 0}
.clist{display:flex;flex-direction:column;gap:10px}
.crow{display:flex;align-items:center;gap:12px;justify-content:space-between;border:1px solid color-mix(in srgb,var(--bg) 25%,transparent);border-radius:12px;padding:10px 12px 10px 14px}
.crow .lbl{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;opacity:.65;display:block}
.crow .val{font-family:var(--f-mono);font-size:.92rem;user-select:all;word-break:break-all}
.crow button{flex:none;background:var(--bg);color:var(--ink);border:0;border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:600}
@media (max-width:760px){.contact{grid-template-columns:1fr}}
footer{padding-block:0 40px;color:var(--muted);font-size:.82rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(14,19,33,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:min(720px,100%);max-height:min(86vh,100%);display:flex;flex-direction:column;background:var(--bg);border:1.5px solid var(--ink);border-radius:20px;box-shadow:8px 8px 0 var(--ink);animation:rise .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes rise{from{transform:translateY(30px) scale(.96);opacity:0}}
.m-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.m-head .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--denim-soft);color:var(--denim)}
.m-head h3{margin:0;font-family:var(--f-display);font-size:1.4rem;letter-spacing:-.02em;line-height:1.1}
.m-head .count{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.m-nav{margin-left:auto;display:flex;gap:6px}
.m-nav button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ink);background:var(--surface);display:grid;place-items:center;font-size:1rem;line-height:1}
.m-body{overflow-y:auto;padding:6px 20px 20px}
.m-block{padding-block:16px;border-bottom:1px dashed var(--line)}
.m-block:last-child{border-bottom:0}
.m-block .meta{font-family:var(--f-mono);font-size:.74rem;color:var(--red);letter-spacing:.04em}
.m-block h4{margin:4px 0 2px;font-size:1.12rem;line-height:1.3}
.m-block .role{color:var(--denim);font-weight:600;font-size:.94rem}
.m-block ul{margin:10px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.m-block li{max-width:62ch}
.m-block li::marker{color:var(--honey)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

/* audio */
let actx;
function tone(f,dur=1.1){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const t0 = actx.currentTime, g = actx.createGain();
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(.22,t0+.01); g.gain.exponentialRampToValueAtTime(.001,t0+dur);
    g.connect(actx.destination);
    [[1,'triangle',1],[2,'sine',.35],[3,'sine',.12]].forEach(([m,type,v])=>{
      const o = actx.createOscillator(), og = actx.createGain(); o.type=type; o.frequency.value=f*m; og.gain.value=v;
      o.connect(og).connect(g); o.start(t0); o.stop(t0+dur);
    });
  }catch(e){}
}
function pressKey(i){
  selKey = i; tone(KEYS[i].f); scopeFreq = 1 + i*.45;
  document.querySelectorAll('.wkey').forEach((el,j)=>{ el.classList.toggle('sel',j===i); if(j===i){ el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),160);} });
  renderStrength(true);
}

function playScale(){

  step();
}

function draw(){
  const w=cv.clientWidth, h=cv.clientHeight; cx2.clearRect(0,0,w,h);
  cx2.strokeStyle=colors.grid; cx2.lineWidth=1; cx2.beginPath();
  for(let x=0;x<=w;x+=w/10){cx2.moveTo(x,0);cx2.lineTo(x,h);} for(let y=0;y<=h;y+=h/4){cx2.moveTo(0,y);cx2.lineTo(w,y);} cx2.stroke();
  curFreq += (scopeFreq-curFreq)*.08;
  const trace=(amp,ph,col,lw)=>{ cx2.strokeStyle=col; cx2.lineWidth=lw; cx2.beginPath();
    for(let x=0;x<=w;x+=2){ const u=x/w; const y=h/2 - amp*h*.38*(Math.sin(2*Math.PI*curFreq*u*2 - tt + ph)*.75 + Math.sin(2*Math.PI*curFreq*u*6 - tt*1.7+ph)*.25)*(.55+.45*Math.sin(Math.PI*u)); x?cx2.lineTo(x,y):cx2.moveTo(x,y);} cx2.stroke(); };
  trace(.55,1.3,colors.red,1.4); trace(1,0,colors.line,2.2);
  $('#scopeF').textContent = `f = ${curFreq.toFixed(1)} Hz`;
  if(!reduce){ tt += .05; requestAnimationFrame(draw); }
}
render(); draw();
</script>
